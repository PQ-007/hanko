<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Vocab Decks icon: red "seal" tile with a paper-colored 語 (word/language),
       matching the popup's washi-paper + hanko-red palette. -->
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B83C30"/>
      <stop offset="1" stop-color="#9A3026"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#seal)"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none"
        stroke="#7E2820" stroke-width="2"/>
  <text x="64" y="64" text-anchor="middle" dominant-baseline="central"
        font-family="Noto Sans CJK JP" font-weight="700" font-size="84"
        fill="#FAF7F0">語</text>
</svg>
