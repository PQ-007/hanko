<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vocab Decks</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Vocab Decks</h1>
    <p class="subtitle">Words you've saved, ready for Anki.</p>
    <div id="accountBar" class="account-bar">
      <span id="accountStatus" class="account-status">Not signed in</span>
      <button id="authBtn" class="secondary">Sign in</button>
    </div>
  </header>

  <div class="deck-bar">
    <select id="deckSelect"></select>
    <button id="newDeckBtn" class="secondary" title="Create a new deck">+ Deck</button>
  </div>

  <div id="newDeckForm" class="new-deck-form hidden">
    <input id="newDeckName" type="text" placeholder="Deck name" />
    <button id="confirmNewDeck" class="secondary">Add</button>
  </div>

  <main id="wordList"></main>

  <footer>
    <button id="exportBtn" class="primary">Export deck for Anki (.txt)</button>
    <button id="deleteDeckBtn" class="danger">Delete deck</button>
  </footer>

  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
