<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vocab Decks</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Vocab Decks</h1>
    <p class="subtitle">Хадгалсан үгс — Anki-д бэлэн.</p>
    <div id="accountBar" class="account-bar">
      <span id="accountStatus" class="account-status">Нэвтрээгүй</span>
      <button id="authBtn" class="secondary">Нэвтрэх</button>
    </div>
  </header>

  <div class="deck-bar">
    <select id="deckSelect"></select>
    <button id="newDeckBtn" class="secondary" title="Шинэ багц үүсгэх">+ Багц</button>
  </div>

  <div id="newDeckForm" class="new-deck-form hidden">
    <input id="newDeckName" type="text" placeholder="Багцын нэр" />
    <button id="confirmNewDeck" class="secondary">Нэмэх</button>
  </div>

  <main id="wordList"></main>

  <footer>
    <button id="exportBtn" class="primary">Anki руу экспорт (.txt)</button>
    <button id="deleteDeckBtn" class="danger">Багц устгах</button>
  </footer>

  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="popup.js"></script>
</body>
</html>
