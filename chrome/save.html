<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<!-- Google's TTS (HankoUI.speak's fallback voice) refuses a Referer. -->
<meta name="referrer" content="no-referrer" />
<title>Үг хадгалах</title>
<style>
  /* Colours, fields, buttons and the dialog come from ui.js (HankoUI). */
  html, body { margin: 0; min-height: 100%; }
  html { background: var(--hk-page, #f7eedd); }
  .wrap { position: relative; min-height: 100vh; padding: 18px 18px 16px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .term { flex: 1; min-width: 0; font-size: 24px; font-weight: 700; line-height: 1.2; word-break: break-all; }
  .loading { margin-top: 6px; font-size: 12px; color: var(--hk-ink-mute); }
  .loading::before {
    content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; vertical-align: -1px;
    border: 2px solid var(--hk-seal-tint); border-top-color: var(--hk-seal-text); border-radius: 999px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .new-deck { display: none; gap: 8px; margin-top: 8px; }
  .new-deck.visible { display: flex; }
  .new-deck input { flex: 1; min-width: 0; }
  .speak { padding: 7px; }
  .speak .hk-ico { width: 18px; height: 18px; }
  .dup { display: none; margin-top: 6px; font-size: 11.5px; font-weight: 600; color: var(--hk-seal-text); }
  .dup.visible { display: block; }
  kbd { font: 600 10px/1 var(--hk-font); opacity: .75; margin-left: 2px; }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .actions .hk-btn { flex: 1; padding: 11px 14px; }
  .saved { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 80vh; }
  .saved .hk-mark { width: 44px; height: 44px; }
</style>
</head>
<body class="hk">
  <div class="wrap" id="app">
    <div class="head">
      <span class="hk-mark" id="mark"></span>
      <div class="term hk-jp" id="term"></div>
      <button class="speak hk-btn hk-ghost hk-icon-btn" id="speak" title="Дуудах" aria-label="Дуудах"><span class="hk-ico" id="speakIco"></span></button>
    </div>
    <div class="loading" id="loading">Дуудлага, утгыг хайж байна…</div>

    <label class="hk-label" for="reading">Дуудлага</label>
    <input class="hk-field hk-jp" type="text" id="reading" placeholder="ねこ" />

    <label class="hk-label" for="mongolian">Утга (монгол)</label>
    <textarea class="hk-field" id="mongolian" placeholder="муур"></textarea>

    <label class="hk-label" for="meaning">Утга (англи)</label>
    <textarea class="hk-field" id="meaning" placeholder="cat"></textarea>

    <label class="hk-label" for="deckSelect">Багц</label>
    <select class="hk-field" id="deckSelect"></select>
    <div class="dup" id="dup">Энэ үг энэ багцад аль хэдийн байна.</div>
    <div class="new-deck" id="newDeckRow">
      <input class="hk-field" type="text" id="newDeckName" placeholder="Шинэ багцын нэр" />
      <button class="hk-btn hk-quiet" id="addDeck">Нэмэх</button>
    </div>

    <div class="actions">
      <button class="hk-btn hk-quiet" id="cancel">Болих</button>
      <button class="hk-btn hk-primary" id="save">Хадгалах <kbd id="saveKey"></kbd></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="sync.js"></script>
  <script src="save.js"></script>
</body>
</html>
