    - assets/battle/characters/demon-b/
    - assets/battle/characters/demon-c/
    - assets/battle/characters/demon-d/
    - assets/battle/characters/demon-e/
    - assets/battle/characters/demoness-a/
    - assets/battle/characters/demoness-b/
    - assets/battle/characters/elite-orc/
    - assets/battle/characters/eyeball-monster/
    - assets/battle/characters/flame-golem/
    - assets/battle/characters/ghostfire/
    - assets/battle/characters/greatsword-skeleton/
    - assets/battle/characters/hellbat/
    - assets/battle/characters/hellhound/
